services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: meetings
      POSTGRES_PASSWORD: meetings
      POSTGRES_DB: meetings
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U meetings"]
      interval: 2s
      retries: 30

volumes:
  pgdata:
